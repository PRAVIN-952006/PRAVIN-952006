[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-guard"
version = "0.1.0"
description = "Focused static checks for GitHub Actions workflow security risks"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "PRAVIN-952006" }]

[project.scripts]
workflow-guard = "workflow_guard.cli:main"

[tool.setuptools.packages.find]
where = ["."]
